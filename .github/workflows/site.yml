# Checks the recipes and builds the static site on every pull request. Pushes
# to main (and manual runs) also publish the site to GitHub Pages.
name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # To bump CookCLI, pick a release from
  # https://github.com/cooklang/cookcli/releases and copy the asset's digest:
  #   gh api repos/cooklang/cookcli/releases/tags/vX.Y.Z \
  #     --jq '.assets[] | select(.name=="cook-x86_64-unknown-linux-musl.tar.gz") | .digest'
  COOK_VERSION: 0.36.0
  COOK_SHA256: f1e414d787df1316b10467bbb09604daea7071e3ef1a8a84396205f2dd9b3094

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install CookCLI
        run: |
          set -euo pipefail
          asset=cook-x86_64-unknown-linux-musl.tar.gz
          curl -fsSL -o "$asset" "https://github.com/cooklang/cookcli/releases/download/v${COOK_VERSION}/${asset}"
          echo "${COOK_SHA256}  ${asset}" | sha256sum -c -
          mkdir cook-dist
          tar -xzf "$asset" -C cook-dist
          sudo install -m 0755 "$(find cook-dist -type f -name cook | head -n 1)" /usr/local/bin/cook
          cook --version | tee /dev/stderr | grep -q "${COOK_VERSION}"

      - name: Validate recipes
        run: cook doctor validate --strict

      - name: Check aisle.conf covers every ingredient
        run: |
          # `cook doctor aisle` exits 0 even when something is missing, so fail
          # on its message instead.
          report="$(cook doctor aisle --show-recipes)"
          echo "$report"
          if grep -q 'not found in aisle' <<< "$report"; then
            exit 1
          fi

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: cook build web _site --base-url "${BASE_PATH}/" --lang en-US

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
